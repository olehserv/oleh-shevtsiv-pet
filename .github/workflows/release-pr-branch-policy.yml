name: Release PR source branch policy

on:
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize, edited ]

permissions: {}

jobs:
  check-release-pr-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      
    steps:
      - uses: actions/checkout@v4
      - name: Validate release branch name
        uses: actions/github-script@v7
        with:
          script: |
            const validatePr = require('./.github/scripts/validate-release-pr.js');
            const pr = context.payload.pull_request;
            const baseBranch = 'main';
            validatePr({ pr, baseBranch, core, setFailed: true });