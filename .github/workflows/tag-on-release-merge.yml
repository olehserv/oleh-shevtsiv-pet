name: Tag on release merge

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

permissions: {}

jobs:
  tag:
    name: Validate version and tag
    runs-on: ubuntu-latest

    # Run only when:
    # - PR is merged
    if: >
      github.event.pull_request.merged == true

    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dry run tag calculation
        id: dry
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}
          tag_prefix: "v"
          default_bump: "patch"
          dry_run: true

      - name: Validate release version + comment in PR
        id: guard
        uses: actions/github-script@v7
        env:
          PREVIOUS_TAG: ${{ steps.dry.outputs.previous_tag }}
          CALCULATED_TAG: ${{ steps.dry.outputs.new_tag }}
          COMMENT_MODE: always
        with:
          script: |
            const validateTag = require('./.github/scripts/validate-release-tag.js');
            await validateTag({ github, context, core, baseBranch: 'main' });

      - name: Create tag
        if: steps.guard.outputs.should_tag == 'true'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}
          tag_prefix: "v"
          default_bump: "patch"